name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    name: Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile and test
        run: |
          /usr/bin/python3 -m py_compile collector.py folder_picker.py
          /usr/bin/python3 -m unittest discover -s tests -v
